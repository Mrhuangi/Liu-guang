name: probe
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Xcode inventory
        run: |
          ls /Applications | grep -i xcode || true
          for app in /Applications/Xcode*.app; do
            echo "=== $app ==="
            DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version || true
            DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks || true
          done
          xcodebuild -version
          xcodebuild -showsdks
